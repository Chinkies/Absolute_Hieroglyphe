[project]
name = "absolute-hieroglyphe"
version = "0.1.0"
description = "Absolute Hieroglyphe"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "importlib-resources==7.1.0",
    "matplotlib>=3.11.2",
    "scikit-learn==1.7.2",
    "tensorflow-datasets==4.9.10",
    "tensorflow[and-cuda]==2.21",
]

[project.scripts]
absolute-hieroglyphe = "absolute_hieroglyphe:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
